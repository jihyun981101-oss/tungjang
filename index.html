<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF6E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2B2320" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="텅장지킴이">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>텅장지킴이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone column (max 480px), sticker-style cards, bottom tab bar with a center "+" button, bottom sheets for input. Mascot avatar changes outfit with budget tier. */
:root{
  --bg:#FFF6E3; --surface:#FFFFFF; --surface2:#FFF1CF; --fg:#3A2C28; --muted:#8A7A72; --line:#F1DDB6;
  --accent:#E8463F; --accent-ink:#FFFFFF; --soft:#FFE4E1; --yellow:#FFC93C; --sky:#5FB4F0; --sky-soft:#E3F2FD;
  --good:#2E9E6A; --good-soft:#DFF3E8; --warn:#D98C00; --warn-soft:#FFF0CC; --bad:#E04E46; --bad-soft:#FBE1DF;
  --s1:#7A5BD1; --s2:#E04E46; --s3:#2E8FD8; --s4:#D98C00; --s5:#1E9E62;
  --shadow:0 4px 0 var(--line);
  --font-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --font-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2B2320; --surface:#37302B; --surface2:#45392E; --fg:#FBEFDD; --muted:#B5A396; --line:#4F4238;
    --accent:#FF6B61; --accent-ink:#2B1A18; --soft:#4A2E2C; --yellow:#FFD166; --sky:#7CC4F5; --sky-soft:#2A3D4D;
    --good:#4DBF87; --good-soft:#223D31; --warn:#F2A93B; --warn-soft:#4A3A1C; --bad:#F26B63; --bad-soft:#4A2826;
    --s1:#8C72D8; --s2:#E05A52; --s3:#3A93D9; --s4:#C98500; --s5:#2EA36A;
    --shadow:0 4px 0 #221B18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2B2320; --surface:#37302B; --surface2:#45392E; --fg:#FBEFDD; --muted:#B5A396; --line:#4F4238;
  --accent:#FF6B61; --accent-ink:#2B1A18; --soft:#4A2E2C; --yellow:#FFD166; --sky:#7CC4F5; --sky-soft:#2A3D4D;
  --good:#4DBF87; --good-soft:#223D31; --warn:#F2A93B; --warn-soft:#4A3A1C; --bad:#F26B63; --bad-soft:#4A2826;
  --s1:#8C72D8; --s2:#E05A52; --s3:#3A93D9; --s4:#C98500; --s5:#2EA36A;
  --shadow:0 4px 0 #221B18; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:400;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}

#app{max-width:480px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:2px}
.top h1{font-size:24px;color:var(--accent)}
.top .date{font-size:13px;color:var(--muted)}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.sync.on{background:var(--good)} .sync.local{background:var(--muted)}

.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.card.tint{background:var(--surface2)}
.card h2{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .lnk{font-family:var(--font-body);font-size:13px;color:var(--accent)}
.card h2 .sub{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400}

/* mascot header */
.me{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center;background:linear-gradient(160deg,var(--surface) 30%,var(--surface2));}
.me svg{width:118px;height:138px;display:block}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px;font-size:14px;line-height:1.4;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bubble b{font-family:var(--font-display);font-weight:400;color:var(--accent)}
.tier{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line)}

.hero .big{font-family:var(--font-display);font-size:46px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:2px 0 6px;word-break:break-all}
.hero .big.bad{color:var(--bad)}
.hero .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--fg);line-height:1.3;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.sky{background:var(--sky-soft);color:var(--sky)}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface2);margin-top:12px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:999px}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.bar>b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.5}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}

/* flow */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.flow .f small{display:block;font-size:11px;color:var(--muted)}
.flow .f b{display:block;font-family:var(--font-display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums;word-break:break-all}
.flow .f b.bad{color:var(--bad)} .flow .f b.good{color:var(--good)}
.flow .op{color:var(--muted);font-size:18px}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;margin-top:8px;background:var(--surface2)}
.stack>i{display:block;height:100%;min-width:0}
.stack>i.short{background:repeating-linear-gradient(135deg,var(--bad) 0 4px,transparent 4px 8px)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;font-size:12px}
.legend div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.legend div span:first-child{display:flex;align-items:center;gap:6px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend .n{font-variant-numeric:tabular-nums}
.sw1{background:var(--s1)} .sw2{background:var(--s2)} .sw3{background:var(--s3)} .sw4{background:var(--s4)} .sw5{background:var(--s5)}

/* daily chart */
.chart{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.chart rect.b{fill:var(--sky)}
.chart rect.b.today{fill:var(--accent)}
.chart rect.b.over{fill:var(--warn)}
.chart rect.b.sel{stroke:var(--fg);stroke-width:1.5}
.chart rect.hit{fill:transparent}
.chart line.budget{stroke:var(--fg);stroke-dasharray:3 3;stroke-width:1;opacity:.5}
.chart line.base{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--font-body)}
.chartlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px;min-height:18px;gap:8px;flex-wrap:wrap}
.chartlbl b{color:var(--fg);font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:16px;background:var(--surface2);border:1.5px solid var(--line);min-width:0;text-align:left}
.chip:active{transform:translateY(2px)}
.chip b{font-weight:400;font-size:14px}
.chip small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.add{background:transparent;border-style:dashed;color:var(--muted);justify-content:center}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);width:100%;text-align:left}
.list .row:first-child{border-top:0}
.row .ic{width:38px;height:38px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{color:var(--muted);font-size:12px}
.row .amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--font-display);font-size:16px}
.row .amt.inc{color:var(--good)}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:12px 0 2px;border-top:1.5px dashed var(--line)}
.dayhead:first-child{border-top:0;padding-top:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface2);border-radius:16px;padding:12px;min-width:0}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--font-display);font-size:21px;font-weight:400;font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all}

.catbar{display:grid;grid-template-columns:28px 1fr auto;gap:4px 8px;align-items:center;font-size:13px;padding:5px 0}
.catbar .t{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;grid-column:2/4}
.catbar .t>i{display:block;height:100%;background:var(--sky);border-radius:999px}
.catbar .n{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:15px;min-height:44px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 3px 0 var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1}

.field{display:flex;flex-direction:column;gap:4px;margin-top:10px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.inp{width:100%;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:44px}
.inp.num{font-variant-numeric:tabular-nums}
textarea.inp{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:14px;color:var(--muted);min-width:0;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 0 var(--line)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line)}
.toggle:first-child{border-top:0}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--good)} .sw.on::after{left:21px}

/* tab bar + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:62px;align-items:center}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);height:100%;justify-content:center}
.tabs button.on{color:var(--accent)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:21;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 20px rgba(232,70,63,.35);
  left:50%;transform:translateX(-50%);bottom:calc(32px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;border:3px solid var(--surface)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}
.fab:active{transform:translateX(-50%) scale(.95)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(58,44,40,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;border-top:2px solid var(--line);
  transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:8px}
.sheet.on{transform:translateY(0)}
.sheet>div{max-width:480px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:20px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .x{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.amtbox{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;padding:8px 4px;font-family:var(--font-display);font-size:40px;font-variant-numeric:tabular-nums;min-height:60px;border-bottom:2px dashed var(--line)}
.amtbox.inc{color:var(--good)}
.amtbox small{font-size:16px;color:var(--muted);font-family:var(--font-body)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pad button{height:48px;border-radius:14px;background:var(--surface2);font-family:var(--font-display);font-size:21px;box-shadow:0 2px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad button.fn{font-family:var(--font-body);font-size:14px;color:var(--muted)}
.quickadd{display:flex;gap:6px;margin-top:8px}
.quickadd button{flex:1;padding:8px;border-radius:12px;border:1.5px solid var(--line);font-size:13px}
.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;background:var(--surface2);font-size:11px;color:var(--muted);min-width:0}
.catgrid button span{font-size:21px;line-height:1.1}
.catgrid button.on{background:var(--soft);color:var(--accent);outline:2px solid var(--accent)}
.catgrid button small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1;pointer-events:auto}
.toast button{color:var(--yellow)}
.wish{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line)}
.wish:first-child{border-top:0}
.wish .t{flex:1;min-width:0}
.wish .t b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wish .t small{font-size:12px;color:var(--muted)}
.wish .ops{display:flex;gap:6px}
.loan{display:flex;flex-direction:column;gap:8px}
.loan .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.loan .hd b{font-size:17px;font-weight:400;font-family:var(--font-display)}
.loan .hd .num{font-family:var(--font-display);font-size:19px}
.sim{margin-top:6px;padding:12px;background:var(--surface2);border-radius:14px;font-size:13px}
.sim .r{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardbox{border-radius:18px;padding:14px;color:#fff;background:var(--cc,#5B6B8C);position:relative;overflow:hidden;min-width:0}
.cardbox::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.cardbox small{display:block;font-size:12px;opacity:.85}
.cardbox b{display:block;font-family:var(--font-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all}
.cardbox .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;opacity:.9;margin-top:8px;flex-wrap:wrap}
.cardbox .ops{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.cardbox .ops button{background:rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="app"></div>

];

const defSettings=()=>({budget:0,payday:21,adjustPrev:true,salary:0,salaryAuto:true,holidays:[],accounts:[],cards:[],defaultPay:'cash',cats:DEF_CATS.map(c=>({...c,kw:[...c.kw]})),fixed:[],last:{}});

/* ---------- state ---------- */
const S={settings:null,loans:{items:[]},wish:{items:[]},months:{},db:null,syncState:'local',tab:'home',viewYM:curYM(),loading:{},edit:null,sheet:null,booted:false,localOnly:false,selDay:null};

/* ---------- storage ---------- */
const LS='tj:';
const lsGet=p=>{try{const v=localStorage.getItem(LS+p);return v?JSON.parse(v):null}catch{return null}};
const lsSet=(p,d)=>{try{localStorage.setItem(LS+p,JSON.stringify(d))}catch{}};
const queues={};
function save(path,data){
  data._upd=Date.now();
  lsSet(path,data);
  if(!S.db) return;
  queues[path]=(queues[path]||Promise.resolve()).then(()=>S.db.doc(path).set(JSON.parse(JSON.stringify(data)))).catch(e=>{
    console.warn('save fail',path,e);
    if(e&&e.code==='invalid_argument'){S.db=null;S.syncState='local';S.localOnly=true;}
    toast('클라우드 저장 실패, 이 기기에만 저장됨');
  });
}
async function load(path){
  if(!S.db) return lsGet(path);
  let cloud;
  try{
    const s=await Promise.race([S.db.doc(path).get(),new Promise(r=>setTimeout(()=>r('timeout'),12000))]);
    if(s==='timeout'){S.syncState='slow';return lsGet(path)}
    cloud=s.exists?JSON.parse(JSON.stringify(s.data())):null; // snapshot data is frozen; work on a copy
  }catch(e){console.warn('load fail',path,e);S.syncState='slow';return lsGet(path)}
  const local=lsGet(path); // read AFTER the await: edits made while waiting are in here
  if(cloud&&(!local||(cloud._upd||0)>=(local._upd||0))){lsSet(path,cloud);return cloud}
  if(local){save(path,local);return local}
  return null;
}
async function ensureMonth(ym){
  if(S.months[ym]) return S.months[ym];

}
const saveMonth=ym=>save('tx/'+ym,S.months[ym]);
const saveSettings=()=>save('app/settings',S.settings);
const saveLoans=()=>save('app/loans',S.loans);
const saveWish=()=>save('app/wish',S.wish);

/* ---------- domain: period / salary ---------- */
const cats=()=>S.settings.cats;
const cat=id=>cats().find(c=>c.id===id)||{id:'etc',name:'기타',emoji:'💸'};
const cardOf=id=>(S.settings.cards||[]).find(c=>c.id===id);
function paydayOf(y,m){const raw=clampDay(y,m,S.settings.payday||21);return S.settings.adjustPrev!==false?prevBiz(raw):raw}
function period(d=today()){
  let start=paydayOf(d.getFullYear(),d.getMonth());
  if(d<parseD(dstr(start))) start=paydayOf(d.getFullYear(),d.getMonth()-1);
  const next=paydayOf(start.getFullYear(),start.getMonth()+1);
  const end=addDays(next,-1);
  const total=dayDiff(start,end)+1, elapsed=dayDiff(start,d)+1, left=total-elapsed+1;
  return {start,end,next,total,elapsed,left};
}
function monthsBetween(a,b){const out=[];let ym=dstr(a).slice(0,7);const last=dstr(b).slice(0,7);while(ym<=last){out.push(ym);ym=addMonthsYM(ym,1)}return out}
function itemsIn(a,b){
  const out=[];for(const ym of monthsBetween(parseD(a),parseD(b))){const m=S.months[ym];if(!m)continue;for(const it of m.items)if(it.date>=a&&it.date<=b)out.push(it)}
  return out.sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(y.ts||0)-(x.ts||0));
}
const isVar=it=>it.type!=='inc'&&!it.src;
const isCash=it=>!it.pay||it.pay==='cash';
function budgetStatus(){
  const P=period(), B=S.settings.budget||0, ts=todayS();
  const items=itemsIn(dstr(P.start),dstr(P.end)).filter(isVar);
  const spent=items.reduce((s,i)=>s+i.amt,0);
  const spentToday=items.filter(i=>i.date===ts).reduce((s,i)=>s+i.amt,0);
  const remain=B-spent;
  const dailyBase=(B-(spent-spentToday))/P.left;
  const todayLeft=dailyBase-spentToday;
  const ideal=B*P.elapsed/P.total;
  const ratio=B>0?spent/B:0;
  let level='good',tier=2;
  if(B>0){ if(remain<0){level='bad';tier=0} else if(spent>ideal*1.15){level='warn';tier=1} else if(spent<=ideal*0.7&&P.elapsed>=3){tier=3} }
  else tier=1;
  return {P,B,items,spent,spentToday,remain,todayLeft,dailyBase,ideal,ratio,level,tier};
}
function prevCompare(st){
  const P=st.P; const ps=paydayOf(P.start.getFullYear(),P.start.getMonth()-1);
  const pe=addDays(ps,P.elapsed-1);
  const prev=itemsIn(dstr(ps),dstr(pe)).filter(isVar).reduce((s,i)=>s+i.amt,0);
  return {prev,ps,pe};
}
function streak(){
  const ts=todayS();let d=addDays(today(),-1),n=0;
  for(let i=0;i<60;i++){const s=dstr(d);const m=S.months[s.slice(0,7)];if(!m)break;if(m.items.some(it=>it.date===s&&isVar(it)))break;n++;d=addDays(d,-1);}
  const P=period();let noSpend=0;
  for(let x=new Date(P.start);x<=today();x=addDays(x,1)){const s=dstr(x);const m=S.months[s.slice(0,7)];if(m&&!m.items.some(it=>it.date===s&&isVar(it)))noSpend++;}
  const todayNo=!(S.months[curYM()]||{items:[]}).items.some(it=>it.date===ts&&isVar(it));
  return {consec:n,noSpend,todayNo};
}
function parseQuick(str){
  let s=str.trim(),amt=null;
  const m=s.match(/(\d[\d,]*\.?\d*)\s*(만|천|k|K)?\s*(원)?/);
  if(m){let n=parseFloat(m[1].replace(/,/g,''));if(m[2]==='만')n*=10000;else if(m[2]==='천'||/k/i.test(m[2]||''))n*=1000;amt=Math.round(n);s=(s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim();}
  let c=null;const low=s.toLowerCase();
  for(const k of cats()){if((k.kw||[]).some(w=>w&&low.includes(w.toLowerCase()))||(s&&low.includes(k.name.toLowerCase()))){c=k.id;break}}
  return {amt,cat:c,memo:s};
}
/* ---------- domain: cards ---------- */
function billDateOf(card,y,m){return nextBiz(clampDay(y,m,card.billDay||14))}
function cardPeriod(card,billY,billM){
  const cut=card.cutoff||31,bd=card.billDay||14;
  const endM=cut<bd?billM:billM-1;
  const end=clampDay(billY,endM,cut);
  const prevEnd=clampDay(billY,endM-1,cut);
  return {start:addDays(prevEnd,1),end};
}
const ymOfDate=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
function ymDiff(a,b){const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)}
function firstBillYM(card,ds){const d=parseD(ds);for(let k=-1;k<=2;k++){const base=clampDay(d.getFullYear(),d.getMonth()+k,1);const {start,end}=cardPeriod(card,base.getFullYear(),base.getMonth());if(ds>=dstr(start)&&ds<=dstr(end))return ymOfDate(base)}return null}
function instShare(it,k){const n=it.inst||1;if(n<=1)return it.amt;const base=Math.floor(it.amt/n);return k===n-1?it.amt-base*(n-1):base}
function cardUse(card,billY,billM){
  const base=clampDay(billY,billM,1);const ym=ymOfDate(base);const {start,end}=cardPeriod(card,billY,billM);
  const from=dstr(clampDay(start.getFullYear(),start.getMonth()-24,1));const startS=dstr(start);const rows=[];
  for(const it of itemsIn(from,dstr(end))){ if(it.type==='inc'||it.pay!==card.id)continue; const n=it.inst||1;
    if(n<=1){ if(it.date>=startS)rows.push({it,share:it.amt,k:0,n}); continue; }
    const f=firstBillYM(card,it.date); if(!f)continue; const k=ymDiff(f,ym); if(k>=0&&k<n)rows.push({it,share:instShare(it,k),k,n}); }
  return {rows,use:rows.reduce((s,r)=>s+r.share,0),ym,start,end};
}
function useFor(card,ym){const b=clampDay(+ym.slice(0,4),+ym.slice(5,7)-1,1);let u=cardUse(card,b.getFullYear(),b.getMonth()).use;if(card.override&&card.override.ym===ym&&card.override.amt>0)u=card.override.amt;return u}
function revFor(card,ym,use){
  const r=card.rev;if(!r||!r.on||!r.asOf||ym<r.asOf)return {carriedIn:0,payment:use,interest:0,carryOut:0,principalPay:use};
  const ratio=Math.min(100,Math.max(1,r.ratio||10))/100,mr=(r.rate||0)/100/12;
  let carried=Math.round(r.carried||0),cur=r.asOf,guard=0;
  while(cur<ym&&guard++<36){carried=Math.round((carried+useFor(card,cur))*(1-ratio));cur=addMonthsYM(cur,1)}
  const billed=carried+use,interest=Math.round(carried*mr),principalPay=Math.round(billed*ratio);
  return {carriedIn:carried,payment:principalPay+interest,interest,carryOut:billed-principalPay,principalPay};
}
function cardBill(card,billY,billM){
  const d=billDateOf(card,billY,billM);const u=cardUse(card,billY,billM);
  let use=u.use,manual=false;
  if(card.override&&card.override.ym===u.ym&&card.override.amt>0){use=card.override.amt;manual=true}
  const rv=revFor(card,u.ym,use);
  return {date:d,start:u.start,end:u.end,ym:u.ym,use,manual,rows:u.rows,carriedIn:rv.carriedIn,billed:use+rv.carriedIn,payment:rv.payment,interest:rv.interest,carryOut:rv.carryOut,principalPay:rv.principalPay,amt:rv.payment};
}
function nextBillOf(card){
  const t=today();let y=t.getFullYear(),m=t.getMonth();
  let b=cardBill(card,y,m);
  if(b.date<parseD(todayS())){b=cardBill(card,y,m+1)}
  const after=cardBill(card,b.date.getFullYear(),b.date.getMonth()+1);
  return {next:b,after};
}
/* ---------- domain: balance ---------- */
function mainAcc(){const a=S.settings.accounts||[];return a.find(x=>x.main)||a[0]||null}
function balanceNow(){
  const b=mainAcc();if(!b)return null;
  let bal=b.amt;
  for(const ym in S.months)for(const it of S.months[ym].items){if((it.ts||0)<=b.ts)continue;if(it.type==='inc')bal+=it.amt;else if(isCash(it))bal-=it.amt;}
  const t=today(),tS=todayS();
  for(const c of S.settings.cards||[]){
    for(let k=-3;k<=1;k++){const bill=cardBill(c,t.getFullYear(),t.getMonth()+k);const ds=dstr(bill.date);if(ds>b.date&&ds<=tS)bal-=bill.amt;}
  }
  return bal;
}
function balances(){
  const accs=S.settings.accounts||[];if(!accs.length)return null;const m=mainAcc();const mainNow=balanceNow();
  const rows=accs.map(a=>({...a,now:a.id===m.id?mainNow:a.amt,isMain:a.id===m.id}));
  return {rows,total:rows.reduce((s,a)=>s+a.now,0)};
}
function upcoming(){
  const P=period(),t=today(),tS=todayS(),endS=dstr(P.end);const list=[];
  for(const f of S.settings.fixed){ if(!f.amt||(f.pay&&f.pay!=='cash'))continue;
    for(let k=0;k<=1;k++){const d=clampDay(t.getFullYear(),t.getMonth()+k,f.day);const ds=dstr(d);if(ds<=tS||ds>endS)continue;const ym=ds.slice(0,7);if((S.months[ym]||{items:[]}).items.some(i=>i.src==='fixed'&&i.ref===f.id))continue;if(f.startMonth&&ym<f.startMonth)continue;list.push({name:f.name,amt:f.amt,date:d,kind:'고정비'})}}
  for(const l of S.loans.items){ if(l.balance<=0)continue;const d=nextDue(l);const ds=dstr(d);if(ds>tS&&ds<=endS)list.push({name:l.name+' 상환',amt:loanMonthly(l).payment,date:d,kind:'대출'})}
  for(const c of S.settings.cards||[]){ for(let k=0;k<=1;k++){const bill=cardBill(c,t.getFullYear(),t.getMonth()+k);const ds=dstr(bill.date);if(ds>tS&&ds<=endS&&bill.amt>0)list.push({name:c.name+' 카드값',amt:bill.amt,date:bill.date,kind:'카드'})}}
  list.sort((a,b)=>a.date-b.date);
  return {list,total:list.reduce((s,x)=>s+x.amt,0)};
}
/* ---------- domain: loans ---------- */
function loanMonthly(l){
  const r=(l.rate||0)/100/12,bal=l.balance||0,interest=bal*r;
  if(l.method==='bullet')return{interest,principal:0,payment:interest};
  if(l.method==='equalP'){const p=Math.min(l.principalPart||0,bal);return{interest,principal:p,payment:p+interest}}
  const pay=l.payment||0;const p=Math.max(0,Math.min(bal,pay-interest));return{interest,principal:p,payment:Math.min(pay,bal+interest)};
}
function simulate(l,extra=0){
  const r=(l.rate||0)/100/12;let bal=Math.max(0,(l.balance||0)-extra);let months=0,interest=0;
  if(bal<=0)return{months:0,interest:0};
  if(l.method==='bullet'){
    let n=0;if(l.endDate){const e=parseD(l.endDate),t=today();n=Math.max(0,(e.getFullYear()-t.getFullYear())*12+(e.getMonth()-t.getMonth()));}
    return{months:n,interest:bal*r*n,infinite:!l.endDate};
  }
  for(let i=0;i<1200&&bal>0.5;i++){const it=bal*r;let p=l.method==='equalP'?(l.principalPart||0):((l.payment||0)-it);if(p<=0)return{months:Infinity,interest:Infinity,infinite:true};p=Math.min(p,bal);bal-=p;interest+=it;months++;}
  return{months,interest};
}
function nextDue(l){
  const t=today();const dd=Math.max(1,Math.min(31,l.dueDay||1));
  let d=clampDay(t.getFullYear(),t.getMonth(),dd);
  if((l.posted&&l.posted[curYM()])||d<parseD(todayS()))d=clampDay(t.getFullYear(),t.getMonth()+1,dd);
  return d;
}
function postLoan(l,ym){
  const m=loanMonthly(l);if(m.payment<=0)return false;
  const dd=Math.min(l.dueDay||1,daysIn(+ym.slice(0,4),+ym.slice(5,7)-1));
  const mo=S.months[ym]||(S.months[ym]={items:[]});
  mo.items.push({id:uid(),ts:Date.now(),date:`${ym}-${pad2(dd)}`,amt:Math.round(m.payment),cat:'loan',memo:`${l.name} 상환`,type:'exp',src:'loan',ref:l.id,pay:'cash'});
  l.balance=Math.max(0,Math.round(l.balance-m.principal));
  l.posted=l.posted||{};l.posted[ym]=true;
  saveMonth(ym);saveLoans();return true;
}
function autopost(){
  const ym=curYM(),t=today(),dom=t.getDate();let msgs=[];
  for(const f of S.settings.fixed){
    if(!f.amt||f.day>dom)continue;if(f.startMonth&&ym<f.startMonth)continue;
    const mo=S.months[ym]||(S.months[ym]={items:[]});
    if(mo.items.some(i=>i.src==='fixed'&&i.ref===f.id))continue;
    mo.items.push({id:uid(),ts:Date.now(),date:`${ym}-${pad2(Math.min(f.day,daysIn(t.getFullYear(),t.getMonth())))}`,amt:f.amt,cat:f.cat||'fixed',memo:f.name,type:'exp',src:'fixed',ref:f.id,pay:f.pay||'cash'});
    saveMonth(ym);msgs.push(f.name);
  }
  for(const l of S.loans.items){
    if(!l.auto||l.balance<=0||(l.dueDay||1)>dom)continue;if(l.posted&&l.posted[ym])continue;
    if(postLoan(l,ym))msgs.push(l.name+' 상환');
  }
  if(S.settings.salary>0&&S.settings.salaryAuto!==false){
    const P=period();const ds=dstr(P.start);const pym=ds.slice(0,7);const mo=S.months[pym]||(S.months[pym]={items:[]});
    if(!mo.items.some(i=>i.src==='salary'&&i.date===ds)&&!(S.settings.salaryStart&&ds<S.settings.salaryStart)){
      mo.items.push({id:uid(),ts:Date.now(),date:ds,amt:S.settings.salary,cat:'salary',memo:'월급',type:'inc',src:'salary',pay:'cash'});saveMonth(pym);msgs.push('월급 입금');
    }
  }
  if(msgs.length)toast('자동 반영: '+msgs.join(', '));
}

  openFixed(id){openFixedSheet(id?S.settings.fixed.find(f=>f.id===id):null)},

  delCat(id){if(['etc','loan','fixed','salary'].includes(id)){toast('이 카테고리는 지울 수 없어요');return}S.settings.cats=cats().filter(c=>c.id!==id);saveSettings();S.edit=null;A.closeSheet();render()},
  async backup(){
    const txt=JSON.stringify({settings:S.settings,loans:S.loans,wish:S.wish,months:S.months,exported:new Date().toISOString()});
    try{await navigator.clipboard.writeText(txt);toast('백업 데이터를 복사했어요. 메모앱에 붙여넣어 두세요')}
    catch{openSheet(`<h3>백업 데이터 <button class="x" onclick="A.closeSheet()">닫기</button></h3><p class="note">아래 내용을 길게 눌러 전체 선택 후 복사하세요.</p><textarea class="inp" style="height:200px;font-size:11px" readonly>${esc(txt)}</textarea>`)}
  },
  saveFbCfg(){const cfg=parseFbCfg($('#fb-cfg').value);if(!cfg||!cfg.projectId||!cfg.apiKey){toast('firebaseConfig 형식이 아니에요. { apiKey: ..., projectId: ... } 전체를 붙여넣어요');return}
    try{localStorage.setItem(LS+'fbcfg',JSON.stringify(cfg))}catch{}toast('설정 저장됨. 이제 Google로 로그인하세요');render()},
  clearFbCfg(){try{localStorage.removeItem(LS+'fbcfg')}catch{}FB.ready=false;FB.user=null;S.db=null;S.syncState='local';render()},
  async fbLogin(){
    let ok=false;try{ok=await fbInit()}catch(e){toast('Firebase 불러오기 실패: '+(e.message||e));return}
    if(!ok){toast('먼저 Firebase 설정을 저장하세요');return}
    const prov=new firebase.auth.GoogleAuthProvider();
    try{const r=await FB.auth.signInWithPopup(prov);FB.user=r.user}
    catch(e){if(/popup|cancelled|blocked/i.test(e.code||'')){try{await FB.auth.signInWithRedirect(prov);return}catch(e2){toast('로그인 실패: '+(e2.message||e2.code));return}}toast('로그인 실패: '+(e.message||e.code));return}
    await connectCloud();toast('클라우드 동기화 시작');
  },
  async fbLogout(){if(FB.auth)await FB.auth.signOut();FB.user=null;S.db=null;S.syncState='local';render();toast('로그아웃. 이 폰 기록은 그대로 남아요')},
  backupFile(){
    const txt=JSON.stringify({settings:S.settings,loans:S.loans,wish:S.wish,months:S.months,exported:new Date().toISOString()});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='tungjang-backup-'+todayS()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('백업 파일을 저장했어요');
  },
  openRestore(){openSheet(`<h3>백업 복원 <button class="x" onclick="A.closeSheet()">닫기</button></h3><p class="note">백업 때 복사한 내용을 붙여넣으세요. 현재 데이터를 덮어씁니다.</p>${STANDALONE?'<input type="file" accept="application/json,.json" class="inp" id="r-file" style="margin-bottom:8px">':''}<textarea class="inp" id="r-txt" style="height:160px;font-size:12px" placeholder='{"settings":...}'></textarea><div class="btnrow" style="margin-top:12px"><button class="btn wide" onclick="A.restore()">복원하기</button></div>`,()=>{const f=$('#r-file');if(f)f.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{$('#r-txt').value=rd.result};rd.readAsText(file)})})},
  restore(){
    try{const d=JSON.parse($('#r-txt').value);if(!d.settings)throw 0;
      S.settings={...defSettings(),...d.settings};S.loans=d.loans||{items:[]};S.wish=d.wish||{items:[]};S.months=d.months||{};
      saveSettings();saveLoans();saveWish();for(const ym in S.months)saveMonth(ym);A.closeSheet();render();toast('복원 완료');
    }catch{toast('형식이 맞지 않아요')}
  },
  resetAsk(){const el=$('#reset-conf');if(el)el.hidden=!el.hidden},
  resetAll(){if(!ready())return;
    for(const ym in S.months){S.months[ym]={items:[]};saveMonth(ym)}
    S.settings=defSettings();S.loans={items:[]};S.wish={items:[]};saveSettings();saveLoans();saveWish();render();toast('모두 지웠어요');
  },
  toggle(el){el.classList.toggle('on')},
};
function segInit(sel,cb){const root=$(sel);if(!root)return;root.querySelectorAll('button').forEach(b=>b.onclick=()=>{root.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(cb)cb(b)})}

/* ---------- sheets ---------- */
function ready(){return true}
function openSheet(html,onMount){if(!ready())return;S.sheet=true;$('#sheetBody').innerHTML='<div class="grab"></div>'+html;$('#scrim').classList.add('on');$('#sheet').classList.add('on');$('#sheet').scrollTop=0;if(onMount)setTimeout(onMount,30)}
const payName=p=>!p||p==='cash'?'현금/체크':(cardOf(p)||{}).name||'카드';

const TX={amt:'',cat:null,type:'exp',date:'',memo:'',edit:null,pay:'cash',inst:1};
const INST=[1,2,3,4,5,6,10,12,18,24];
function openTxSheet(pre){
  Object.assign(TX,{amt:pre.amt?String(pre.amt):'',cat:pre.cat||null,type:pre.type||'exp',date:pre.date||todayS(),memo:pre.memo||'',edit:pre._edit||null,src:pre.src||null,ref:pre.ref||null,pay:pre.pay||(pre._edit?'cash':(S.settings.defaultPay||'cash')),inst:pre.inst||1});
  if(TX.pay!=='cash'&&!cardOf(TX.pay))TX.pay='cash';
  const ts=todayS(),ys=dstr(addDays(today(),-1));
  const cards=S.settings.cards||[];
  openSheet(`<h3>${TX.edit?'내역 수정':'얼마 썼어요?'} <button class="x" onclick="A.closeSheet()">닫기</button></h3>
    <input class="inp" id="t-quick" placeholder="귀찮으면 한 줄로: 스벅 4500 / 점심 1.2만" autocomplete="off">
    <div class="amtbox ${TX.type==='inc'?'inc':''}" id="t-amt"></div>
    <div class="quickadd">
      <button onclick="TXA.plus(1000)">+1천</button><button onclick="TXA.plus(5000)">+5천</button><button onclick="TXA.plus(10000)">+1만</button><button onclick="TXA.plus(50000)">+5만</button>
    </div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="TXA.key('${n}')">${n}</button>`).join('')}
      <button onclick="TXA.key('00')">00</button><button onclick="TXA.key('0')">0</button><button class="fn" onclick="TXA.back()">⌫</button>
    </div>
    <div class="catgrid" id="t-cats"></div>
    <div class="field"><label>결제수단</label><div class="seg" id="t-pay"><button data-p="cash" class="${TX.pay==='cash'?'on':''}">현금/체크</button>${cards.map(c=>`<button data-p="${c.id}" class="${TX.pay===c.id?'on':''}">${esc(c.name)}</button>`).join('')}</div></div>
    <div class="field" id="t-inst-wrap" ${TX.pay==='cash'?'hidden':''}><label>할부</label><select class="inp" id="t-inst">${INST.map(n=>`<option value="${n}" ${TX.inst===n?'selected':''}>${n===1?'일시불':n+'개월'}</option>`).join('')}</select><span class="note" style="margin-top:2px">할부는 카드값에 n개월로 나눠 잡히고, 생활비 예산에는 산 날 전액 잡혀요 (무이자 기준).</span></div>
    <div class="grid2" style="margin-top:10px">
      <div class="seg" id="t-type"><button data-t="exp" class="${TX.type==='exp'?'on':''}">지출</button><button data-t="inc" class="${TX.type==='inc'?'on':''}">수입</button></div>
      <div class="seg" id="t-date"><button data-d="${ts}" class="${TX.date===ts?'on':''}">오늘</button><button data-d="${ys}" class="${TX.date===ys?'on':''}">어제</button><button data-d="pick" class="${TX.date!==ts&&TX.date!==ys?'on':''}">${TX.date!==ts&&TX.date!==ys?esc(TX.date.slice(5)):'날짜'}</button></div>
    </div>
    <input type="date" class="inp" id="t-datepick" value="${esc(TX.date)}" style="margin-top:8px" ${TX.date!==ts&&TX.date!==ys?'':'hidden'}>
    <div class="field"><label>메모 (선택)</label><input class="inp" id="t-memo" value="${esc(TX.memo)}" placeholder="뭐에 썼는지"></div>
    <div class="btnrow" style="margin-top:14px">
      ${TX.edit?'<button class="btn danger" onclick="TXA.del()">삭제</button>':''}
      <button class="btn" style="flex:2" onclick="TXA.save()">${TX.edit?'수정 저장':'저장'}</button>
    </div>`,()=>{
      TXA.draw();
      $('#t-quick').addEventListener('input',e=>{const p=parseQuick(e.target.value);if(p.amt!=null)TX.amt=String(p.amt);if(p.cat)TX.cat=p.cat;if(p.memo!==undefined)$('#t-memo').value=p.memo;TXA.draw()});
      $('#t-quick').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();TXA.save()}});
      segInit('#t-type',b=>{TX.type=b.dataset.t;TXA.draw()});
      segInit('#t-pay',b=>{TX.pay=b.dataset.p;$('#t-inst-wrap').hidden=TX.pay==='cash'});
      $('#t-inst').addEventListener('change',e=>{TX.inst=+e.target.value||1});
      $('#t-date').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.d==='pick'){$('#t-datepick').hidden=false;$('#t-datepick').focus()}else{TX.date=b.dataset.d;$('#t-datepick').hidden=true}TXA.draw()});
      $('#t-datepick').addEventListener('change',e=>{if(e.target.value){TX.date=e.target.value;TXA.draw()}});
      if(!TX.edit&&!pre.cat)$('#t-quick').focus();
    });
}
const TXA={
  draw(){
    const a=$('#t-amt');if(!a)return;const n=+TX.amt||0;
    a.className='amtbox'+(TX.type==='inc'?' inc':'');a.innerHTML=`${TX.type==='inc'?'<small>+</small>':''}${n.toLocaleString('ko-KR')}<small>원</small>`;
    $('#t-cats').innerHTML=cats().map(c=>`<button class="${TX.cat===c.id?'on':''}" onclick="TXA.cat('${c.id}')"><span>${esc(c.emoji)}</span><small>${esc(c.name)}</small></button>`).join('');
    $('#t-type').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===TX.type));
    const ts=todayS(),ys=dstr(addDays(today(),-1));
    $('#t-date').querySelectorAll('button').forEach(b=>{const pick=b.dataset.d==='pick';b.classList.toggle('on',pick?(TX.date!==ts&&TX.date!==ys):b.dataset.d===TX.date);if(pick)b.textContent=(TX.date!==ts&&TX.date!==ys)?TX.date.slice(5):'날짜'});
  },
  key(k){if(TX.amt.length>=10)return;TX.amt=(TX.amt+k).replace(/^0+(?=\d)/,'');TXA.draw()},
  back(){TX.amt=TX.amt.slice(0,-1);TXA.draw()},
  plus(n){TX.amt=String((+TX.amt||0)+n);TXA.draw()},
  cat(id){TX.cat=id;TXA.draw()},
  save(){
    const amt=+TX.amt||0;if(!amt){$('#t-amt').style.borderColor='var(--bad)';toast('금액을 입력해 주세요');return}
    const memo=$('#t-memo').value.trim();
    const c=TX.cat||(TX.type==='inc'?'salary':'etc');
    if(TX.edit){
      const old=removeTx(TX.edit.id,TX.edit.ym);
      const tx={...(old||{}),id:TX.edit.id,ts:old?old.ts:Date.now(),date:TX.date,amt,cat:c,memo,type:TX.type,pay:TX.type==='inc'?'cash':TX.pay};
      delete tx.inst;if(tx.pay!=='cash'&&TX.inst>1)tx.inst=TX.inst;
      const ym=ymOf(tx.date);(S.months[ym]||(S.months[ym]={items:[]})).items.push(tx);saveMonth(ym);
      A.closeSheet();render();toast('수정했어요');return;
    }
    const tx={id:uid(),ts:Date.now(),date:TX.date,amt,cat:c,memo,type:TX.type,pay:TX.type==='inc'?'cash':TX.pay};
    if(tx.pay!=='cash'&&TX.inst>1)tx.inst=TX.inst;
    addTx(tx);A.closeSheet();render();
    toast(`${cat(c).emoji} ${won(amt)} ${TX.type==='inc'?'수입':payName(tx.pay)} 저장`,()=>removeTx(tx.id,ymOf(tx.date)));
  },
  del(){if(!TX.edit)return;const it=removeTx(TX.edit.id,TX.edit.ym);
    if(it&&it.src==='loan'){const l=S.loans.items.find(x=>x.id===it.ref);if(l&&l.posted){delete l.posted[TX.edit.ym];saveLoans()}}
    A.closeSheet();render();toast('삭제했어요',()=>{if(it){(S.months[TX.edit.ym]||(S.months[TX.edit.ym]={items:[]})).items.push(it);saveMonth(TX.edit.ym)}})},
};

function openCardSheet(c){

function render(){
  const app=$('#app');if(!S.settings)return;
  ['home','hist','debt','set'].forEach(t=>{const b=$('#tab-'+t);if(b)b.classList.toggle('on',S.tab===t)});
  const syncTitle=S.syncState==='on'?'클라우드 동기화 중':S.syncState==='local'?(STANDALONE?'이 폰에 저장':'이 기기에만 저장'):'연결 중';
  const head=(title)=>`<div class="top"><h1>${title}</h1><span class="date">${koDate(today())}<span class="sync ${S.syncState==='on'?'on':S.syncState==='local'?'local':''}" title="${syncTitle}"></span></span></div>`;
  let html='';
  if(S.tab==='home')html=head('텅장지킴이')+renderHome();
  else if(S.tab==='hist')html=head('내역')+renderHist();
  else if(S.tab==='debt')html=head('카드·대출')+renderDebt();
  else html=head('설정')+renderSet();
  const banner=S.syncState==='connecting'?`<div class="pill warn" style="text-align:center;padding:8px;border-radius:14px">☁️ 클라우드와 맞추는 중… 그냥 써도 돼요</div>`:S.syncState==='slow'?`<div class="pill warn" style="text-align:center;padding:8px;border-radius:14px">☁️ 클라우드 응답이 느려요. 이 기기 기록으로 보여주고 있어요</div>`:'';
  app.innerHTML=`<div class="view">${banner}${html}</div>`;
}

function renderDaily(st){
  const P=st.P;const W=340,H=90,padL=4,padB=14,top=6;const n=P.total;const bw=(W-padL*2)/n;
  const days=[];for(let i=0;i<n;i++){const d=addDays(P.start,i);const ds=dstr(d);const amt=itemsIn(ds,ds).filter(isVar).reduce((s,x)=>s+x.amt,0);days.push({ds,d,amt})}
  const daily=st.B?st.B/P.total:0;const max=Math.max(daily*1.6,...days.map(x=>x.amt),1);
  const y=v=>top+(H-top-padB)*(1-v/max);
  const bars=days.map((x,i)=>{const bx=padL+i*bw+1,w=Math.max(1,bw-2);const h=Math.max(0,y(0)-y(x.amt));const cls='b'+(x.ds===todayS()?' today':daily&&x.amt>daily?' over':'')+(S.selDay===x.ds?' sel':'');
    return `${x.amt>0?`<rect class="${cls}" x="${bx.toFixed(1)}" y="${(y(0)-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`:''}<rect class="hit" x="${(padL+i*bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" onclick="A.selDay('${x.ds}')"/>`}).join('');
  const ticks=days.map((x,i)=>({x,i})).filter(({x,i})=>i===0||x.d.getDate()===1||x.d.getDate()===10||i===n-1).map(({x,i})=>`<text x="${(padL+i*bw+bw/2).toFixed(1)}" y="${H-2}" text-anchor="middle">${x.d.getMonth()+1}/${x.d.getDate()}</text>`).join('');
  const sel=S.selDay?days.find(x=>x.ds===S.selDay):null;
  const label=sel?`<b>${sel.d.getMonth()+1}월 ${sel.d.getDate()}일 (${WD[sel.d.getDay()]})</b> ${won(sel.amt)}${daily?(sel.amt>daily?` · 하루 기준보다 ${won(sel.amt-daily)} 초과`:' · 하루 기준 안'):''}`:`<span>막대를 누르면 그날 지출을 보여줘요</span><span>${daily?'점선 = 하루 기준 '+won(daily):''}</span>`;
  return `<section class="card"><h2>하루하루 생활비 <span class="sub">${md(P.start)} ~ ${md(P.end)}</span></h2>
    <svg class="chart" viewBox="0 0 ${W} ${H}" aria-label="기간 내 일별 생활비 막대그래프">
      <line class="base" x1="${padL}" x2="${W-padL}" y1="${y(0)}" y2="${y(0)}"/>
      ${daily?`<line class="budget" x1="${padL}" x2="${W-padL}" y1="${y(daily).toFixed(1)}" y2="${y(daily).toFixed(1)}"/>`:''}
      ${bars}${ticks}</svg>
    <div class="chartlbl">${label}</div></section>`;
}
function fmtLeft(ms){const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);if(h>=24)return `${Math.floor(h/24)}일 ${h%24}시간`;if(h>0)return `${h}시간 ${m}분`;return `${m}분`}
function txRow(it){
  const c=cat(it.cat);const ym=ymOf(it.date);const pay=it.type==='inc'?'':(!it.pay||it.pay==='cash'?'':' · '+esc(payName(it.pay)));
  return `<button class="row" onclick="A.editTx('${it.id}','${ym}')"><div class="ic">${esc(c.emoji)}</div><div class="tx"><b>${esc(it.memo||c.name)}</b><small>${esc(c.name)}${pay}${it.inst>1?` · 할부 ${it.inst}개월`:''}${it.src==='fixed'?' · 자동':it.src==='loan'?' · 자동이체':it.src==='salary'?' · 자동':''}</small></div><div class="amt ${it.type==='inc'?'inc':''}">${it.type==='inc'?'+':'-'}${(it.amt||0).toLocaleString('ko-KR')}</div></button>`;

function renderHist(){

  let days='',last='';

  return `<section class="card"><div class="top" style="padding:0 0 10px"><button class="btn sm ghost" onclick="A.mon(-1)">‹</button><h2 style="margin:0;font-size:19px">${y}년 ${m}월</h2><button class="btn sm ghost" onclick="A.mon(1)" ${ym>=curYM()?'disabled':''}>›</button></div>

    ${cmpTxt?`<p class="note">${cmpTxt}</p>`:''}</section>
    ${catList.length?`<section class="card"><h2>어디에 썼나</h2>${catList.map(([id,v])=>{const c=cat(id);return `<div class="catbar"><span>${esc(c.emoji)}</span><span>${esc(c.name)}</span><span class="n">${won(v)} <span class="muted">${Math.round(v/exp*100)}%</span></span><div class="t"><i style="width:${v/max*100}%"></i></div></div>`}).join('')}</section>`:''}
    <section class="card">${items.length?`<div class="list">${days}</div>`:'<div class="empty">이 달엔 기록이 없어요.</div>'}</section>`;

function simHTML(l,extra){
  const base=simulate(l),alt=simulate(l,extra);
  const mTxt=n=>n===Infinity?'원금이 안 줄어요 (상환액 < 이자)':n>=12?`${Math.floor(n/12)}년 ${n%12}개월`:`${n}개월`;
  if(!extra)return `<div class="r"><span>남은 기간</span><b>${mTxt(base.months)}</b></div><div class="r"><span>앞으로 낼 이자</span><b class="num">${base.interest===Infinity?'∞':won(base.interest)}</b></div>`;
  const saved=base.interest-alt.interest,mo=base.months-alt.months;
  return `<div class="r"><span>남은 기간</span><b>${mTxt(base.months)} → ${mTxt(alt.months)}</b></div><div class="r"><span>앞으로 낼 이자</span><b class="num">${won(alt.interest)}</b></div>
    <div class="r" style="color:var(--good)"><span>절약되는 이자</span><b class="num">${saved===Infinity||isNaN(saved)?'계산 불가':won(saved)}${isFinite(mo)&&mo>0?` · ${mo}개월 단축`:''}</b></div>`;
}
function revWarn(){
  const rc=(S.settings.cards||[]).filter(c=>c.rev&&c.rev.on).map(c=>({c,b:nextBillOf(c).next}));
  if(!rc.length)return '';
  const carried=rc.reduce((s,x)=>s+x.b.carriedIn,0),intr=rc.reduce((s,x)=>s+x.b.interest,0);
  if(!carried)return '';
  return `<div class="sim" style="border:1.5px solid var(--bad);margin-top:10px"><b style="font-weight:400;color:var(--bad)">리볼빙 이월 잔액 ${won(carried)}</b>
    <div class="r"><span>이번 달 리볼빙 수수료</span><b>${won(intr)}</b></div><div class="r"><span>1년 이대로면 수수료</span><b>약 ${won(intr*12)}</b></div>
    <p class="note" style="margin:6px 0 0">리볼빙 수수료는 대부분 연 15~19%로 대출보다 비싸요. 여유가 생기면 이월 잔액을 먼저 갚는 게 가장 큰 절약이에요. 갚았으면 카드 수정에서 이월 잔액을 고쳐주세요.</p></div>`;
}

    ${s.fixed.length?`<div class="list">${s.fixed.map(f=>`<button class="row" onclick="A.openFixed('${f.id}')"><div class="ic">${esc(cat(f.cat).emoji)}</div><div class="tx"><b>${esc(f.name)}</b><small>매달 ${f.day}일 · ${esc(payName(f.pay))} · 자동 기록</small></div><div class="amt">${(f.amt||0).toLocaleString('ko-KR')}</div></button>`).join('')}</div><p class="note">합계 ${won(s.fixed.reduce((a,f)=>a+f.amt,0))} / 월</p>`:'<div class="empty">월세, 관리비, 보험료, 구독처럼 매달 나가는 돈을 넣어두면 날짜에 자동 기록돼요.</div>'}</section>
    <section class="card"><h2>카테고리 <button class="lnk" onclick="A.openCat()">＋ 추가</button></h2>
    <div class="chips">${s.cats.map(c=>`<button class="chip" onclick="A.openCat('${c.id}')"><b>${esc(c.emoji)} ${esc(c.name)}</b><small>${(c.kw||[]).slice(0,3).join(', ')||'키워드 없음'}</small></button>`).join('')}</div></section>
    ${STANDALONE?renderCloud():''}
    <section class="card"><h2>데이터</h2>
    <p class="note" style="margin-top:0">${S.syncState==='on'?(STANDALONE?'기록은 이 폰과 본인 Firebase 계정에 함께 저장돼요.':'기록은 클라우드에 저장되고 있어요. 다른 기기에서 같은 링크로 열어도 그대로 보여요.'):S.localOnly?'클라우드 쓰기 권한이 없어 이 기기에만 저장돼요. 로그인한 본인 계정으로 열면 동기화돼요.':S.syncState==='slow'?'클라우드 응답이 느려 이 기기 기록을 먼저 보여줘요. 저장은 계속 클라우드로도 보내요. 앱 위쪽에 권한 요청이 떠 있으면 허용해 주세요.':STANDALONE?'기록은 이 폰의 브라우저 안에 저장돼요. 홈 화면에 추가한 앱으로만 열면 안전하고, 브라우저 데이터를 지우면 기록도 사라지니 가끔 백업 파일을 저장해 두세요. 여러 기기에서 보려면 위의 클라우드 동기화를 켜요.':'클라우드 연결을 못 해서 이 기기에만 저장돼요. 백업을 가끔 복사해 두세요.'}</p>
    <div class="btnrow"><button class="btn ghost" onclick="A.backup()">백업 복사</button>${STANDALONE?'<button class="btn ghost" onclick="A.backupFile()">백업 파일 저장</button>':''}<button class="btn ghost" onclick="A.openRestore()">백업 복원</button></div>
    ${STANDALONE?`<p class="note">홈 화면에 추가: iPhone은 Safari 공유 버튼 → "홈 화면에 추가", Android는 Chrome 메뉴 → "앱 설치" 또는 "홈 화면에 추가".</p>`:''}
    <div style="margin-top:14px"><button class="btn sm danger" onclick="A.resetAsk()">전체 초기화</button>
    <div id="reset-conf" hidden class="conf" style="margin-top:8px"><span class="note" style="margin:0">정말 다 지울까요? 되돌릴 수 없어요.</span><button class="btn sm danger" onclick="A.resetAll()">네, 지울게요</button></div></div></section>
    <p class="note" style="text-align:center">텅장지킴이 · 귀찮아도 한 줄, 쓰고 싶어도 하루만, 빚은 눈에 보이게</p>`;
}

/* ---------- cloud sync (standalone site: Firebase, 본인 계정만 읽기/쓰기) ---------- */
const FB={cfg:null,auth:null,user:null,ready:false,err:null};
const fbCfgGet=()=>{try{return JSON.parse(localStorage.getItem(LS+'fbcfg')||'null')}catch{return null}};
function parseFbCfg(txt){const m=String(txt||'').match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0])}catch{}try{return Function('"use strict";return ('+m[0]+')')()}catch{return null}}
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('스크립트 로드 실패'));document.head.appendChild(el)})}
async function fbInit(){
  if(FB.ready)return true;const cfg=fbCfgGet();if(!cfg||!cfg.projectId||!cfg.apiKey)return false;
  const v='10.14.1';
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
  if(!firebase.apps.length)firebase.initializeApp(cfg);FB.auth=firebase.auth();FB.cfg=cfg;
  try{await FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch{}
  try{const r=await FB.auth.getRedirectResult();if(r&&r.user)FB.user=r.user}catch(e){console.warn(e);FB.err=e.message}
  if(!FB.user)FB.user=await new Promise(res=>{const un=FB.auth.onAuthStateChanged(u=>{un();res(u)});setTimeout(()=>res(FB.auth.currentUser),8000)});
  FB.auth.onAuthStateChanged(u=>{FB.user=u});
  FB.ready=true;return true;
}
function fbAdapter(){
  const fs=firebase.firestore();const uid=FB.user.uid;
  return {doc(path){const ref=fs.collection('users').doc(uid).collection('docs').doc(path.replace(/\//g,'__'));
    return {get:async()=>{const sn=await ref.get();return {exists:sn.exists,data:()=>sn.data()}},set:d=>ref.set(d)}}};
}
async function getDb(){
  if(!STANDALONE){try{return await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))])}catch{return null}}
  try{if(await fbInit()&&FB.user)return fbAdapter()}catch(e){console.warn(e);FB.err=e.message||String(e);toast('클라우드 연결 실패: '+FB.err)}
  return null;
}
let lastSync=0;
async function connectCloud(){
  S.syncState='connecting';render();
  S.db=await getDb();
  const ym=curYM();const need=new Set();for(let i=0;i<=6;i++)need.add(addMonthsYM(ym,-i));
  const P=period();for(const m of monthsBetween(P.start,P.end))need.add(m);
  if(S.db){
    const [st,lo,wi]=await Promise.all([load('app/settings'),load('app/loans'),load('app/wish')]);
    if(st)S.settings={...defSettings(),...st};if(lo)S.loans=lo;if(wi)S.wish=wi;
    await Promise.all([...need].map(async m=>{const d=await load('tx/'+m);S.months[m]=d||S.months[m]||{items:[]}}));
    if(S.syncState!=='slow')S.syncState='on';
  }else{
    S.syncState='local';
    for(const m of need)if(!S.months[m])S.months[m]=lsGet('tx/'+m)||{items:[]};
  }
  lastSync=Date.now();
  if(S.settings.balance&&!(S.settings.accounts||[]).length){const b=S.settings.balance;S.settings.accounts=[{id:'ac'+uid(),name:'주거래 통장',amt:b.amt,date:b.date,ts:b.ts,main:true}];delete S.settings.balance;saveSettings();}
  render();autopost();render();
}
/* ---------- boot ---------- */
async function boot(){
  S.settings={...defSettings(),...(lsGet('app/settings')||{})};
  S.loans=lsGet('app/loans')||{items:[]};S.wish=lsGet('app/wish')||{items:[]};
  const ym=curYM();
  for(let i=0;i<=6;i++){const m=addMonthsYM(ym,-i);const d=lsGet('tx/'+m);if(d)S.months[m]=d}
  try{S.tab=localStorage.getItem(LS+'tab')||'home'}catch{}
  S.booted=true;render();
  await connectCloud();
  setInterval(()=>{if(S.tab==='home'&&!S.sheet)render()},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.db&&Date.now()-lastSync>60000&&!S.sheet)connectCloud()});
}
boot();
</script>
